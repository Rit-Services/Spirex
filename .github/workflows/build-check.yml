# Proves the Dockerfiles still build — on every pull request, BEFORE merge.
#
# Nothing is pushed to a registry here. This exists so a broken Dockerfile shows
# up as a red X on the PR instead of as a failed release two steps later, and so
# nobody has to run `docker build` on their own machine to find out.
#
# amd64 only: it is the same Dockerfile on both architectures, and doubling every
# PR's build time to re-prove that is not worth it. Genuinely arch-specific
# breakage (a Prisma engine that has no arm64 binary, say) surfaces in the release
# build, which does build both.
name: Build check

on:
  pull_request:

concurrency:
  group: build-check-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  compose:
    name: compose files parse
    runs-on: ubuntu-latest
    # release-please's PR only bumps version numbers and regenerates CHANGELOG.md
    # — no Dockerfile, no source, no compose. Building images for it is pure waste
    # and turns every merge into a wall of notifications. Safe to skip because
    # `gitleaks` is the only REQUIRED check; a required check that never reports
    # would leave the PR stuck on "Expected — waiting for status" forever.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    steps:
      - uses: actions/checkout@v7

      # `.env` is gitignored, and the server service declares `env_file: .env`,
      # which compose treats as REQUIRED — so a fresh checkout cannot resolve the
      # file at all. That is correct behaviour for real users (better to fail
      # loudly than boot with no JWT_SECRET), so the fix belongs here, not in the
      # compose file. Copying the example first also makes this a stronger test:
      # it proves the exact quickstart in the README actually works.
      - name: Seed .env from the documented example
        run: cp .env.example .env

      # `config` fully resolves interpolation and schema — it catches a typo'd
      # key or an unbalanced override that `up` would only reveal on a server.
      - name: Validate compose (pull-first + build override)
        run: |
          docker compose -f docker-compose.yml config >/dev/null
          echo "docker-compose.yml OK"
          docker compose -f docker-compose.yml -f docker-compose.build.yml config >/dev/null
          echo "docker-compose.yml + docker-compose.build.yml OK"

  build:
    name: build ${{ matrix.image }} image
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    strategy:
      fail-fast: false
      matrix:
        image: [server, client]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: false
          # Reads the release workflow's warm cache; writes to its own scope so a
          # PR can never poison what a release build pulls from.
          cache-from: type=gha,scope=${{ matrix.image }}-linux-amd64
          cache-to: type=gha,mode=min,scope=pr-${{ matrix.image }}
