# Secret-scan gate — the CI mirror of scripts/secret-scan.sh.
#
# Runs gitleaks over the working tree (--no-git) with the repo's .gitleaks.toml
# on every PR and every push to main. gitleaks exits non-zero when it finds a
# secret, which fails the job and blocks the merge. Make this a required check
# in branch protection so a leaked key can never land on main.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same ref so a force-push doesn't pile up jobs.
concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Identical invocation to scripts/secret-scan.sh so local and CI results
      # can never diverge: same image, same ruleset, same --no-git tree scan.
      - name: gitleaks (working-tree scan)
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --no-git --config /repo/.gitleaks.toml --redact --verbose

      - name: Result
        if: success()
        run: echo "gitleaks: clean — no secrets found."
