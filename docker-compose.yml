# SPIREX — one-command self-host stack.
#
#   cp .env.example .env      # then edit secrets in .env
#   docker compose up -d      # postgres + server + frontend  →  http://localhost
#
# Object storage is optional: the default STORAGE_DRIVER=local keeps uploads on a
# docker volume. To use MinIO instead, set STORAGE_DRIVER=minio in .env and start
# with the profile:  docker compose --profile minio up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-spirex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-spirex}
      POSTGRES_DB: ${POSTGRES_DB:-spirex}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-spirex} -d ${POSTGRES_DB:-spirex}"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    # Everything in .env is passed to the server; DATABASE_URL below is computed
    # from the compose network so it always points at the `postgres` service on
    # its INTERNAL port 5432 (no host-port juggling).
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-spirex}:${POSTGRES_PASSWORD:-spirex}@postgres:5432/${POSTGRES_DB:-spirex}
    volumes:
      - server_uploads:/app/server/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: client/Dockerfile
    restart: unless-stopped
    # The only port you need to expose. nginx serves the SPA and proxies /api to
    # the server service. Change the left number to move it off port 80.
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - server

  # Optional S3-compatible object store. Enable with: --profile minio
  minio:
    image: minio/minio:latest
    profiles: ["minio"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-spirexminio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-spirexminio}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
  server_uploads:
  minio_data:
